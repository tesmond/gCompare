name: Build binaries

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows/amd64
            artifact: gCompare-windows-amd64
            archive: gCompare-windows-amd64.zip
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux/amd64
            artifact: gCompare-linux-amd64
            archive: gCompare-linux-amd64.tar.gz
          - name: macOS universal
            runner: macos-latest
            platform: darwin/universal
            artifact: gCompare-macos-universal
            archive: gCompare-macos-universal.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Build binary
        if: runner.os == 'Windows'
        run: wails build -clean -trimpath -platform ${{ matrix.platform }}

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: wails build -clean -trimpath -platform ${{ matrix.platform }}

      - name: Archive Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/gCompare.exe -DestinationPath gCompare-windows-amd64.zip

      - name: Archive Linux binary
        if: runner.os == 'Linux'
        run: tar -czf gCompare-linux-amd64.tar.gz -C build/bin gCompare

      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: tar -czf gCompare-macos-universal.tar.gz -C build/bin gCompare.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: gCompare-windows-amd64
          path: dist/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: gCompare-linux-amd64
          path: dist/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: gCompare-macos-universal
          path: dist/macos

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/windows/gCompare-windows-amd64.zip
          dist/linux/gCompare-linux-amd64.tar.gz
          dist/macos/gCompare-macos-universal.tar.gz
          --repo "$GH_REPO"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
